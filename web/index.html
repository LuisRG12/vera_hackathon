<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vera — seguimiento posoperatorio por voz</title>
<meta name="description" content="Agente de voz clínico que llama al paciente recién operado, responde solo con sus documentos y avisa al equipo ante un signo de alarma.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --fondo: #06070b;
    --vidrio: rgba(255, 255, 255, .035);
    --vidrio-alto: rgba(255, 255, 255, .06);
    --borde: rgba(255, 255, 255, .08);
    --borde-fuerte: rgba(255, 255, 255, .14);
    --texto: #eef0f5;
    --suave: #9097a7;
    --tenue: #5d6475;
    --teal: #2dd4bf;
    --indigo: #6366f1;
    --violeta: #a78bfa;
    --rosa: #f472b6;
    --naranja: #fb923c;
    --rojo: #f43f5e;
    --verde: #34d399;
    --ambar: #fbbf24;
    --radio: 22px;
    --sombra: 0 30px 80px -40px rgba(0, 0, 0, .9);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--fondo); color: var(--texto); min-height: 100vh;
    font: 15px/1.55 "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--violeta); outline-offset: 3px; border-radius: 10px; }

  /* La luz de fondo: dos resplandores quietos que dan profundidad al vidrio. */
  .luz { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .luz::before, .luz::after { content: ""; position: absolute; border-radius: 50%; filter: blur(120px); }
  .luz::before { width: 60vw; height: 60vw; left: -18vw; top: -22vw; background: rgba(45, 212, 191, .10); }
  .luz::after { width: 55vw; height: 55vw; right: -18vw; bottom: -25vw; background: rgba(139, 92, 246, .12); }

  .envoltura { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 22px 20px 40px; }

  /* ------------------------------------------------------------ barra */
  .barra { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .marca { display: flex; align-items: center; gap: 12px; }
  .marca-orbe { width: 34px; height: 34px; border-radius: 50%;
                background: conic-gradient(from 200deg, var(--teal), var(--indigo), var(--rosa), var(--naranja), var(--teal));
                box-shadow: 0 0 24px rgba(139, 92, 246, .45); position: relative; }
  .marca-orbe::after { content: ""; position: absolute; inset: 3px; border-radius: 50%;
                       background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), rgba(6,7,11,.2) 55%, rgba(6,7,11,.65)); }
  .marca strong { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .marca span { color: var(--suave); font-size: 14px; }
  .barra-der { display: flex; align-items: center; gap: 10px; }
  .pildora { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px;
             border: 1px solid var(--borde); background: var(--vidrio); font-size: 12.5px; color: var(--suave);
             white-space: nowrap; }
  .pildora i { width: 7px; height: 7px; border-radius: 50%; background: var(--tenue); }
  .pildora.bien i { background: var(--verde); box-shadow: 0 0 10px var(--verde); }
  .pildora.mal i { background: var(--ambar); box-shadow: 0 0 10px var(--ambar); }
  .idioma { display: flex; padding: 3px; border-radius: 999px; border: 1px solid var(--borde); background: var(--vidrio); }
  .idioma button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; font-size: 12.5px;
                   font-weight: 700; color: var(--suave); }
  .idioma button[aria-pressed="true"] { background: rgba(255,255,255,.1); color: var(--texto); }

  .aviso { display: flex; gap: 12px; align-items: flex-start; margin: 18px 0 20px; padding: 12px 16px;
           border-radius: 16px; border: 1px solid rgba(251, 191, 36, .22);
           background: linear-gradient(90deg, rgba(251, 191, 36, .07), rgba(251, 191, 36, .02)); font-size: 13.5px; }
  .aviso svg { flex: none; margin-top: 2px; color: var(--ambar); }
  .aviso strong { color: #fde68a; font-weight: 700; }
  .aviso span { color: var(--suave); }

  /* ------------------------------------------------------------ rejilla */
  .rejilla { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  /* minmax(0, …): sin él, una pista de la rejilla se estira hasta el ancho mínimo
     de su contenido y en un teléfono la página se sale de la pantalla. */
  .columna { display: grid; gap: 20px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
  .tarjeta { position: relative; border-radius: var(--radio); border: 1px solid var(--borde);
             background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
             box-shadow: inset 0 1px 0 rgba(255,255,255,.05), var(--sombra);
             backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); padding: 22px; }
  .tarjeta h2 { margin: 0 0 4px; font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
  .tarjeta .bajada { margin: 0 0 16px; color: var(--suave); font-size: 13.5px; }

  /* ------------------------------------------------------------ el agente */
  .agente { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 28px 24px 24px; }
  .agente .lema { margin: 0; max-width: 34rem; color: var(--suave); font-size: 14.5px; }
  .agente h1 { margin: 0 0 8px; font-size: clamp(24px, 3vw, 32px); font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
  .agente h1 em { font-style: normal; background: linear-gradient(90deg, var(--teal), var(--violeta), var(--rosa));
                  -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* El orbe. No es decorativo: late con la voz de quien esté hablando, cambia
     cuando Vera piensa y se enciende cuando salta una alarma. `--nivel` lo
     escribe el bucle de animación a partir del audio real. */
  .orbe-marco { position: relative; width: min(290px, 68vw); aspect-ratio: 1; margin: 26px 0 10px;
                animation: respirar 6s ease-in-out infinite; }
  .orbe { --nivel: 0; --vel: 1; position: absolute; inset: 0;
          transform: scale(calc(1 + var(--nivel) * .2)); transition: transform .09s linear; }
  .orbe .capa { position: absolute; border-radius: 50%; filter: blur(26px); mix-blend-mode: screen;
                animation: orbita calc(var(--vel) * 11s) linear infinite; transition: opacity .6s; }
  .orbe .a { inset: 6%; background: radial-gradient(circle at 30% 35%, var(--teal), transparent 62%); }
  .orbe .b { inset: 8%; background: radial-gradient(circle at 70% 38%, var(--indigo), transparent 62%);
             animation-duration: calc(var(--vel) * 14s); animation-direction: reverse; }
  .orbe .c { inset: 10%; background: radial-gradient(circle at 48% 76%, var(--rosa), transparent 60%);
             animation-duration: calc(var(--vel) * 17s); }
  .orbe .d { inset: 14%; background: radial-gradient(circle at 64% 62%, var(--naranja), transparent 55%);
             opacity: .45; animation-duration: calc(var(--vel) * 21s); animation-direction: reverse; }
  /* El núcleo no puede leerse como una rueda de colores: con poco desenfoque el
     degradado cónico deja sectores marcados. Muy desenfocado y a media opacidad,
     solo tiñe; el color lo ponen las capas y la textura, las líneas. */
  .orbe .nucleo { position: absolute; inset: 16%; border-radius: 50%;
                  background: conic-gradient(from 0deg, var(--teal), var(--indigo), var(--rosa), var(--naranja), var(--teal));
                  filter: blur(22px) saturate(1.2); opacity: .7;
                  animation: girar calc(var(--vel) * 9s) linear infinite; }
  .orbe .cuerpo-orbe { position: absolute; inset: 20%; border-radius: 50%;
                       background: radial-gradient(circle at 40% 35%, rgba(94,234,212,.55), transparent 55%),
                                   radial-gradient(circle at 68% 62%, rgba(244,114,182,.55), transparent 58%),
                                   radial-gradient(circle at 30% 72%, rgba(99,102,241,.6), transparent 60%),
                                   radial-gradient(circle at 72% 30%, rgba(251,146,60,.35), transparent 50%),
                                   #120f2a;
                       filter: blur(2px);
                       animation: girar calc(var(--vel) * 16s) linear infinite reverse; }
  .orbe .lineas { position: absolute; inset: 19%; border-radius: 50%; mix-blend-mode: overlay; opacity: .55;
                  background: repeating-radial-gradient(circle at 50% 130%, rgba(255,255,255,.35) 0 1px, transparent 1.5px 7px);
                  -webkit-mask: radial-gradient(circle, #000 48%, transparent 70%);
                  mask: radial-gradient(circle, #000 48%, transparent 70%);
                  animation: girar calc(var(--vel) * 40s) linear infinite reverse; }
  .orbe .brillo { position: absolute; inset: 24%; border-radius: 50%;
                  background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.5), transparent 42%); }
  .orbe .anillo { position: absolute; inset: 2%; border-radius: 50%; border: 1px solid rgba(255,255,255,.06);
                  transition: box-shadow .4s, border-color .4s; }
  .orbe[data-estado="reposo"] { --vel: 1.6; }
  .orbe[data-estado="escuchando"] { --vel: 1; }
  .orbe[data-estado="escuchando"] .a { opacity: 1; }
  .orbe[data-estado="escuchando"] .c { opacity: .55; }
  .orbe[data-estado="pensando"] { --vel: .45; }
  .orbe[data-estado="pensando"] .nucleo { filter: blur(8px) saturate(1.4) hue-rotate(40deg); }
  .orbe[data-estado="hablando"] { --vel: .8; }
  .orbe[data-estado="hablando"] .b, .orbe[data-estado="hablando"] .c { opacity: 1; }
  .orbe[data-estado="hablando"] .a { opacity: .6; }
  .orbe[data-alerta="high"] .anillo { border-color: rgba(251,146,60,.6); box-shadow: 0 0 60px rgba(251,146,60,.45), inset 0 0 40px rgba(251,146,60,.25); animation: latido 1.1s ease-in-out infinite; }
  .orbe[data-alerta="critical"] .anillo { border-color: rgba(244,63,94,.7); box-shadow: 0 0 70px rgba(244,63,94,.55), inset 0 0 50px rgba(244,63,94,.3); animation: latido .8s ease-in-out infinite; }
  @keyframes orbita { from { transform: rotate(0deg) translateX(4%) rotate(0deg); } to { transform: rotate(360deg) translateX(4%) rotate(-360deg); } }
  @keyframes girar { to { transform: rotate(360deg); } }
  @keyframes respirar { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
  @keyframes latido { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

  .estado-orbe { margin: 4px 0 0; font-weight: 700; font-size: 15px; min-height: 1.5em; }
  .detalle { margin: 2px 0 0; font-size: 12.5px; color: var(--tenue); min-height: 1.4em; }
  #vivo { width: 100%; min-height: 50px; margin: 16px 0 18px; padding: 12px 16px; border-radius: 16px;
          border: 1px dashed var(--borde-fuerte); color: var(--suave); font-size: 14px; font-style: italic;
          text-align: left; }
  #vivo:empty::before { content: attr(data-vacio); color: var(--tenue); }

  .modos { display: inline-flex; padding: 4px; border-radius: 999px; border: 1px solid var(--borde);
           background: rgba(0,0,0,.25); margin-bottom: 16px; }
  .modos button { border: 0; background: none; padding: 7px 18px; border-radius: 999px; font-weight: 600;
                  font-size: 13.5px; color: var(--suave); display: inline-flex; align-items: center; gap: 7px; }
  .modos button[aria-selected="true"] { background: rgba(255,255,255,.09); color: var(--texto); }
  .zona-modo { width: 100%; display: flex; flex-direction: column; align-items: center; }

  .llamar { display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px;
            padding: 14px 30px; font-weight: 700; font-size: 15.5px; color: #061312;
            background: linear-gradient(90deg, var(--teal), #5eead4 45%, var(--violeta));
            box-shadow: 0 10px 40px -10px rgba(45, 212, 191, .6); transition: transform .15s, box-shadow .2s; }
  .llamar:hover { transform: translateY(-1px); box-shadow: 0 14px 44px -10px rgba(45, 212, 191, .75); }
  .llamar.en-curso { color: #fff; background: linear-gradient(90deg, #e11d48, var(--rojo));
                     box-shadow: 0 10px 40px -10px rgba(244, 63, 94, .6); }
  .cronometro { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--suave); margin-top: 10px; min-height: 1.3em; }
  .nota { margin: 14px 0 0; color: var(--tenue); font-size: 12.5px; max-width: 32rem; }

  form { display: flex; gap: 8px; width: 100%; }
  input { flex: 1; min-width: 0; font: inherit; color: var(--texto); padding: 13px 18px; border-radius: 999px;
          border: 1px solid var(--borde-fuerte); background: rgba(0,0,0,.3); }
  input::placeholder { color: var(--tenue); }
  .enviar { border: 0; border-radius: 999px; padding: 0 20px; font-weight: 700; color: #061312;
            background: linear-gradient(90deg, var(--teal), var(--violeta)); }

  /* ------------------------------------------------------------ paciente y cifras */
  .ficha { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px;
           border: 1px solid var(--borde); background: rgba(0,0,0,.2); }
  .avatar-paciente { flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
                     background: linear-gradient(135deg, rgba(45,212,191,.25), rgba(99,102,241,.25));
                     border: 1px solid var(--borde-fuerte); color: var(--teal); }
  .ficha strong { display: block; font-size: 14.5px; }
  .ficha span { color: var(--suave); font-size: 13px; }
  .docs { margin: 14px 0 0; color: var(--suave); font-size: 13.5px; }
  .cifras { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .cifra { padding: 14px; border-radius: 16px; border: 1px solid var(--borde); background: rgba(0,0,0,.22); }
  .cifra b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1;
             background: linear-gradient(90deg, #fff, #c7cbe0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cifra span { display: block; margin-top: 6px; font-size: 12px; color: var(--suave); line-height: 1.4; }

  /* ------------------------------------------------------------ frases guía */
  .frases { display: flex; flex-direction: column; }
  .frase { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%;
           padding: 13px 4px; border: 0; border-top: 1px solid var(--borde); background: none; text-align: left;
           transition: background .15s; border-radius: 0; }
  .frase:first-child { border-top: 0; }
  .frase:hover { background: rgba(255,255,255,.025); }
  .frase .texto { min-width: 0; }
  .frase .dicho { display: block; font-weight: 600; font-size: 14.5px; }
  .frase .glosa { display: block; color: var(--tenue); font-size: 12.5px; margin-top: 1px; }
  .ruta { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
          font-size: 12px; font-weight: 600; border: 1px solid; white-space: nowrap; }
  .ruta i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .ruta.r-plan   { color: var(--teal);    border-color: rgba(45,212,191,.35);  background: rgba(45,212,191,.07); }
  .ruta.r-guia   { color: #818cf8;        border-color: rgba(129,140,248,.35); background: rgba(129,140,248,.07); }
  .ruta.r-abst   { color: var(--suave);   border-color: var(--borde-fuerte);   background: rgba(255,255,255,.03); }
  .ruta.r-alerta { color: var(--naranja); border-color: rgba(251,146,60,.4);   background: rgba(251,146,60,.08); }
  .ruta.r-emerg  { color: var(--rojo);    border-color: rgba(244,63,94,.45);   background: rgba(244,63,94,.08); }
  .ruta.r-cierre { color: var(--violeta); border-color: rgba(167,139,250,.4);  background: rgba(167,139,250,.08); }
  .frases-nota { margin: 12px 0 0; color: var(--tenue); font-size: 12.5px; }

  /* ------------------------------------------------------------ alertas */
  #alertas { display: grid; gap: 12px; }
  #alertas:empty { display: none; }
  .alerta { display: flex; gap: 14px; padding: 16px 18px; border-radius: 18px; border: 1px solid;
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  .alerta svg { flex: none; margin-top: 2px; }
  .alerta.high { border-color: rgba(251,146,60,.4); background: linear-gradient(90deg, rgba(251,146,60,.14), rgba(251,146,60,.03)); }
  .alerta.high svg { color: var(--naranja); }
  .alerta.critical { border-color: rgba(244,63,94,.5); background: linear-gradient(90deg, rgba(244,63,94,.18), rgba(244,63,94,.04));
                     box-shadow: 0 0 40px -12px rgba(244,63,94,.6); }
  .alerta.critical svg { color: var(--rojo); }
  .alerta .cab { font-weight: 800; font-size: 13px; letter-spacing: .04em; }
  .alerta .por { font-size: 14px; margin-top: 2px; }
  .alerta .meta { margin-top: 4px; }

  /* ------------------------------------------------------------ conversación */
  .conv-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .conv-cab h2 { margin: 0; }
  .boton-sec { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--borde-fuerte);
               background: var(--vidrio); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; }
  .boton-sec:hover { background: var(--vidrio-alto); }
  #conversacion { display: flex; flex-direction: column; gap: 14px; max-height: 620px; overflow-y: auto;
                  padding-right: 4px; scrollbar-width: thin; scrollbar-color: var(--borde-fuerte) transparent; }
  .vacia { color: var(--tenue); font-size: 14px; text-align: center; padding: 28px 0; margin: 0; }
  .msg { display: flex; gap: 10px; max-width: 92%; }
  .msg.yo { align-self: flex-end; flex-direction: row-reverse; }
  .msg.eco, .msg.separador { align-self: center; max-width: 100%; }
  .mini-orbe { flex: none; width: 28px; height: 28px; border-radius: 50%; margin-top: 2px;
               background: conic-gradient(from 200deg, var(--teal), var(--indigo), var(--rosa), var(--naranja), var(--teal));
               box-shadow: 0 0 14px rgba(139,92,246,.4); }
  .globo { padding: 12px 15px; border-radius: 18px; border: 1px solid var(--borde); min-width: 0;
           overflow-wrap: anywhere; }
  .yo .globo { background: rgba(99,102,241,.14); border-color: rgba(99,102,241,.3); border-top-right-radius: 6px; }
  .vera .globo { background: rgba(255,255,255,.04); border-top-left-radius: 6px; }
  .vera .globo.high { border-color: rgba(251,146,60,.5); box-shadow: inset 3px 0 0 var(--naranja); }
  .vera .globo.critical { border-color: rgba(244,63,94,.55); box-shadow: inset 3px 0 0 var(--rojo); }
  .eco .globo { border-style: dashed; background: none; color: var(--tenue); font-size: 13px; font-style: italic; text-align: center; }
  .separador .globo { border: 0; background: none; color: var(--tenue); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .cuerpo { font-size: 14.5px; }
  .meta { font-size: 11.5px; color: var(--tenue); margin-top: 7px; line-height: 1.5; }
  .trad { font-size: 13.5px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--borde-fuerte);
          color: var(--suave); font-style: italic; }

  .fuentes { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .fuente { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 999px;
            border: 1px solid rgba(45,212,191,.3); background: rgba(45,212,191,.07); color: #99f6e4;
            font-size: 12px; text-decoration: none; max-width: 100%; }
  .fuente:hover { background: rgba(45,212,191,.14); }
  .fuente .demo { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 6px; margin-left: 2px;
                  color: #fcd34d; background: rgba(251,191,36,.12); border: 1px solid rgba(251,191,36,.3); }
  .sin-fuente { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--suave); }

  .chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid; font-style: normal; }
  .chip.critical { border-color: rgba(244,63,94,.5); color: #fda4af; }
  .chip.high     { border-color: rgba(251,146,60,.45); color: #fdba74; }
  .chip.moderate { border-color: rgba(251,191,36,.4); color: #fcd34d; }
  .chip.low, .chip.none { border-color: var(--borde-fuerte); color: var(--suave); }

  .pie { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 26px;
         color: var(--tenue); font-size: 12.5px; }
  .pie nav { display: flex; gap: 16px; }
  .pie a { color: var(--suave); text-decoration: none; }
  .pie a:hover { color: var(--texto); }

  @media (max-width: 960px) {
    .rejilla { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 560px) {
    .envoltura { padding: 16px 16px 32px; }
    .tarjeta { padding: 18px; }
    .cifras { grid-template-columns: 1fr; }
    .frase { flex-direction: column; align-items: flex-start; gap: 8px; }
    .marca span { display: none; }
    .msg { max-width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .orbe-marco, .orbe .capa, .orbe .nucleo, .orbe .lineas { animation: none !important; }
  }
</style>

<div class="luz" aria-hidden="true"></div>
<div class="envoltura">
  <header class="barra">
    <div class="marca">
      <span class="marca-orbe" aria-hidden="true"></span>
      <strong>Vera</strong>

function aplicarIdioma() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll('[data-t]')) {
    const v = t(el.dataset.t);
    if (typeof v === 'string') el.textContent = v;

  for (const el of document.querySelectorAll('[data-t-html]')) el.innerHTML = t(el.dataset.tHtml);

  document.getElementById('en').setAttribute('aria-pressed', lang === 'en');

  pintarServicio();
  traducirBtn.hidden = lang !== 'en' || !lineas.length;
  pintarSugerencias();
  repintar();
}

  aplicarIdioma();

    const b = document.createElement('button');
    b.className = 'frase';
    b.type = 'button';
    b.innerHTML = '<span class="texto"><span class="dicho"></span><span class="glosa"></span></span><span class="ruta"><i></i><span></span></span>';
    b.querySelector('.dicho').textContent = s.es;
    const glosa = b.querySelector('.glosa');
    if (lang === 'en') glosa.textContent = s.en; else glosa.remove();
    const r = b.querySelector('.ruta');
    r.classList.add(s.tono);
    r.querySelector('span').textContent = s.ruta[lang];
    b.onclick = () => { mostrarModo('texto'); enviarTexto(s.es); };
    cont.appendChild(b);
  }
}

// ------------------------------------------------------------ el orbe
const orbe = document.getElementById('orbe');
const etiquetaOrbe = document.getElementById('estado-orbe');
let estadoOrbe = 'reposo', nivelMic = 0, nivelSuave = 0, hablaTextoHasta = 0, relojAlerta;

function ponerEstado(e) {
  estadoOrbe = e;
  orbe.dataset.estado = e;
  etiquetaOrbe.textContent = T[lang].estados[e];
}

function alertaOrbe(severidad) {
  orbe.dataset.alerta = severidad;
  clearTimeout(relojAlerta);
  relojAlerta = setTimeout(() => { delete orbe.dataset.alerta; }, 4000);
}

let analizador = null, bufAnalizador = null;
function bucleOrbe() {
  // El nivel sale del audio real: el de Vera por un analizador en la salida, el
  // de quien habla por la energía de lo que manda el micrófono.
  let n = 0;
  if (analizador && sonandoAhora) {
    analizador.getFloatTimeDomainData(bufAnalizador);
    let s = 0;
    for (let i = 0; i < bufAnalizador.length; i++) s += bufAnalizador[i] * bufAnalizador[i];
    n = Math.min(1, Math.sqrt(s / bufAnalizador.length) * 5);
  } else if (estadoOrbe === 'escuchando') {
    n = nivelMic;
  } else if (hablaTextoHasta > performance.now()) {
    n = .22 + .14 * Math.sin(performance.now() / 170);
  }
  nivelSuave += (n - nivelSuave) * .22;
  nivelMic *= .9;
  orbe.style.setProperty('--nivel', nivelSuave.toFixed(3));
  requestAnimationFrame(bucleOrbe);
}
requestAnimationFrame(bucleOrbe);

// ------------------------------------------------------------ la conversación
const conversacion = document.getElementById('conversacion');
const alertas = document.getElementById('alertas');
const traducirBtn = document.getElementById('traducir');
// Lo que se puede traducir, en orden, con el elemento debajo del cual va.
let lineas = [];
// Lo que depende del idioma y ya está en pantalla: se vuelve a construir al
// cambiarlo. Sin esto, quien pasa a inglés a mitad de conversación ve la
// pantalla nueva en inglés y todo lo anterior en español.
let repintables = [];
let alertasHist = [];

function limpiarConversacion() {
  conversacion.textContent = '';
  alertas.textContent = '';
  lineas = [];
  repintables = [];
  alertasHist = [];
  traducirBtn.hidden = true;
}

function repintable(d, construir) {
  const r = { construir, el: construir() };
  d.appendChild(r.el);
  repintables.push(r);
  return r;
}

function repintar() {
  for (const r of repintables) { const n = r.construir(); r.el.replaceWith(n); r.el = n; }
  pintarAlertas();
}

// Devuelve el globo, que es donde se cuelga todo lo demás del turno.
function burbuja(clase, texto) {
  conversacion.querySelector('.vacia')?.remove();
  const fila = document.createElement('div');
  fila.className = 'msg ' + clase;
  if (clase === 'vera') {
    const a = document.createElement('span');
    a.className = 'mini-orbe';
    fila.appendChild(a);
  }
  const globo = document.createElement('div');
  globo.className = 'globo';
  const cuerpo = document.createElement('div');
  cuerpo.className = 'cuerpo';
  cuerpo.textContent = texto;
  globo.appendChild(cuerpo);
  fila.appendChild(globo);
  conversacion.appendChild(fila);
  conversacion.scrollTop = conversacion.scrollHeight;
  return globo;
}

function metaEl(texto) {
  const m = document.createElement('div');
  m.className = 'meta';
  m.textContent = texto;
  return m;
}

// La traducción va justo debajo de lo que traduce: `ancla` es el cuerpo del
// globo, no el globo. Anexarla al final la dejaba debajo del motivo del juez.
function registrar(ancla, texto) {
  if (!texto) return;
  lineas.push({ ancla, texto });
  if (lang === 'en') traducirBtn.hidden = false;
}

function chips(senales) {
  const d = document.createElement('div');
  d.className = 'chips';
  for (const s of senales || []) {
    const c = document.createElement('span');
    c.className = 'chip ' + s.severidad;
    c.textContent = `${concepto(s.concepto)} · «${s.coincidencia}»`;
    d.appendChild(c);
  }
  return d;
}

// La cita es lo que distingue una respuesta de Vera de una respuesta de un
// modelo: se muestra en cada turno, con enlace al documento tal como se indexó.
function fuentes(m) {
  const f = document.createElement('div');
  f.className = 'fuentes';
  if (m.citas?.length) {
    for (const c of m.citas) {
      const a = document.createElement('a');
      a.className = 'fuente';
      a.target = '_blank';
      a.rel = 'noopener';
      a.href = '/documentos/' + encodeURIComponent(c.documento);
      a.innerHTML = ICONO_DOC + '<span></span>';
      a.querySelector('span').textContent = `${c.documento.replace(/\.md$/, '')} § ${c.seccion}`;
      if (c.ficticio) {
        const b = document.createElement('span');
        b.className = 'demo';
        b.textContent = t('demo');
        a.appendChild(b);
      }
      f.appendChild(a);
    }
  } else {
    const l = document.createElement('span');
    l.className = 'sin-fuente';
    l.innerHTML = ICONO_ESCUDO + '<span></span>';
    l.querySelector('span').textContent = m.marca === 'sin_evidencia' ? t('sin_evidencia') : t('sin_cita');
    f.appendChild(l);
  }
  return f;
}

function pieVera(m, conJuez) {
  const p = document.createElement('div');
  p.appendChild(fuentes(m));
  const l = m.latencia || {};
  const marca = m.marca !== 'ok' ? ` (${T[lang].marcas[m.marca] || m.marca})` : '';
  p.appendChild(metaEl(`${t('riesgo')} ${T[lang].riesgos[m.riesgo] || m.riesgo} · ${T[lang].acciones[m.accion] || m.accion}` +
    ` · ${t('decidio')} ${T[lang].fuentes_dec[m.fuente] || m.fuente}` +
    ` · ${t('escrito_por')} ${m.redactado_por === 'codigo' ? t('el_codigo') : t('el_modelo')}${marca}` +
    ` · ${t('primera_frase')} ${l.primera_frase_ms ?? '—'} ms` +
    (conJuez ? ` · ${t('juez')} ${l.juez_ms ?? '—'} ms` : '')));
  return p;
}

function cerrarTurnoVera(d, m, conJuez) {
  d.classList.add(m.riesgo);
  repintable(d, () => pieVera(m, conJuez));
  const cuerpo = d.querySelector('.cuerpo');
  registrar(cuerpo, cuerpo.textContent);
  // El motivo es del juez y viene en español: no se repinta, se traduce.
  if (m.motivo) { const r = metaEl(m.motivo); d.appendChild(r); registrar(r, m.motivo); }
  conversacion.scrollTop = conversacion.scrollHeight;
}

function mostrarAlerta(m) {
  const a = { m, antes: null, t: Date.now() };
  alertasHist.push(a);
  if (m.en_parcial) (adelantadas[m.orden] ||= []).push(a);
  alertaOrbe(m.severidad);
  pintarAlertas();
}

function pintarAlertas() {
  alertas.textContent = '';
  for (const { m, antes } of alertasHist) {
    const d = document.createElement('div');
    d.className = 'alerta ' + m.severidad;
    d.innerHTML = ICONO_ALERTA + '<div><div class="cab"></div><div class="por"></div><div class="meta"></div></div>';
    const titulo = m.severidad === 'critical' ? t('alerta_emergencia') : t('alerta_escalar');
    d.querySelector('.cab').textContent = `${titulo} · ${concepto(m.concepto).toUpperCase()}`;
    d.querySelector('.por').textContent = T[lang].por(m.coincidencia, m.texto);
    d.querySelector('.meta').textContent =
      `${t('turno')} ${m.orden} · ${m.en_parcial ? t('en_parcial') : t('al_cerrar')} · ` +
      (m.origen === 'juez' ? t('origen_juez') : t('origen_reglas')) +
      (antes ? ' · ' + T[lang].antes(antes) : '');
    alertas.prepend(d);
  }
}

traducirBtn.onclick = async () => {
  const pendientes = lineas.filter(x => !x.traducida);
  if (!pendientes.length) return;
  const rotulo = traducirBtn.querySelector('span');

  } catch (e) {

  } finally {

// ------------------------------------------------------------ pestañas
function mostrarModo(m) {
  document.getElementById('modo-voz').hidden = m !== 'voz';
  document.getElementById('modo-texto').hidden = m !== 'texto';
  document.getElementById('tab-voz').setAttribute('aria-selected', m === 'voz');
  document.getElementById('tab-texto').setAttribute('aria-selected', m === 'texto');
}
document.getElementById('tab-voz').onclick = () => mostrarModo('voz');

// ------------------------------------------------------------ por voz
const btn = document.getElementById('btn');
const estado = document.getElementById('estado');
const vivo = document.getElementById('vivo');
const cronometro = document.getElementById('cronometro');
let ws, ctx, ctxVoz, stream, tParcial = 0, inicioLlamada = null;
// Alertas que saltaron en un parcial, por turno: cuando ese turno cierre se sabe
// cuánto se adelantó la alerta al cierre, que es lo que ganó leer parciales.
let adelantadas = {};
// Reproducción de Vera: los trozos se encadenan sin huecos y cada uno sabe de qué
// turno es. Al interrumpir se descarta todo lo de ese turno.
let proximo = 0, fuentesAudio = new Set(), callado = 0, sonandoAhora = false;
let lineaVera = null;
// Si Vera se despidió, colgar no puede cortar la despedida a la mitad: el
// servidor ya mandó todo el audio y cierra, y el navegador lo deja sonar.
let despedida = false;

function pintarBoton() {
  btn.innerHTML = (ws ? ICONO_COLGAR : ICONO_TEL) + '<span></span>';
  btn.querySelector('span').textContent = ws ? t('colgar') : t('llamar');
  btn.classList.toggle('en-curso', !!ws);
}

setInterval(() => {
  if (!inicioLlamada) { cronometro.textContent = ''; return; }
  const s = Math.floor((Date.now() - inicioLlamada) / 1000);
  cronometro.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}, 500);

const WORKLET = `
class Captura extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0][0];
    if (!ch) return true;
    // El servidor y AssemblyAI esperan PCM 16 bits con signo.
    const pcm = new Int16Array(ch.length);
    for (let i = 0; i < ch.length; i++) {
      const s = Math.max(-1, Math.min(1, ch[i]));
      pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    this.port.postMessage(pcm.buffer, [pcm.buffer]);
    return true;
  }
}
registerProcessor('captura', Captura);`;

function avisarSonando(v) {
  // El servidor solo sabe cuándo terminó de mandar el audio, no cuándo terminó
  // de sonar. Se lo dice el navegador: mientras Vera suena no hay silencio que
  // contar.
  if (v === sonandoAhora) return;
  sonandoAhora = v;
  if (ws) ponerEstado(v ? 'hablando' : 'escuchando');
  if (ws?.readyState === 1) ws.send(JSON.stringify({ type: 'sonando', valor: v }));
}

function reproducir(buf) {
  const n = new DataView(buf).getUint32(0, true);
  if (n <= callado || !ctxVoz) return;
  const pcm = new Int16Array(buf, 4, Math.floor((buf.byteLength - 4) / 2));
  const f = new Float32Array(pcm.length);
  for (let i = 0; i < pcm.length; i++) f[i] = pcm[i] / 32768;
  const trozo = ctxVoz.createBuffer(1, f.length, ctxVoz.sampleRate);
  trozo.copyToChannel(f, 0);
  const src = ctxVoz.createBufferSource();
  src.buffer = trozo;
  src.connect(analizador || ctxVoz.destination);
  const inicio = Math.max(proximo, ctxVoz.currentTime + 0.03);
  src.start(inicio);
  proximo = inicio + trozo.duration;
  fuentesAudio.add(src);
  avisarSonando(true);
  src.onended = () => {
    fuentesAudio.delete(src);
    if (!fuentesAudio.size) { avisarSonando(false); if (!ws && despedida) ponerEstado('reposo'); }
  };
}

function callar(hasta) {
  callado = Math.max(callado, hasta);
  for (const s of fuentesAudio) { try { s.stop(); } catch {} }
  fuentesAudio.clear();
  proximo = 0;
  avisarSonando(false);
  if (lineaVera) { repintable(lineaVera, () => metaEl(t('interrumpida'))); lineaVera = null; }
}

btn.onclick = async () => {
  if (ws) return parar();
  estado.textContent = t('pidiendo_mic');
  // El contexto de reproducción se crea aquí, dentro del clic: los navegadores
  // no dejan sonar audio que no empezó con un gesto de quien usa la página.
  ctxVoz = new AudioContext({ sampleRate: 24000 });
  ctxVoz.resume();
  analizador = ctxVoz.createAnalyser();
  analizador.fftSize = 1024;
  bufAnalizador = new Float32Array(analizador.fftSize);
  analizador.connect(ctxVoz.destination);

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
    });
  } catch (e) {
    estado.textContent = t('sin_mic') + e.message;
    return;
  }

  limpiarConversacion();
  adelantadas = {};
  callado = 0; proximo = 0; lineaVera = null; despedida = false;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/llamada`);
  ws.binaryType = 'arraybuffer';
  pintarBoton();
  ponerEstado('pensando');

  ws.onmessage = ev => {
    if (ev.data instanceof ArrayBuffer) { reproducir(ev.data); return; }
    const m = JSON.parse(ev.data);
    if (m.type === 'ocupado')  { estado.textContent = T[lang].ocupado(m); parar(); return; }
    if (m.type === 'error')    { estado.textContent = t('error') + m.detalle; parar(); return; }
    if (m.type === 'inactiva') { estado.textContent = t('terminada'); parar(); return; }
    if (m.type === 'aviso')    { estado.textContent = t('aviso_srv') + m.detalle; return; }
    if (m.type === 'adios') {
      despedida = true;
      estado.textContent = m.motivo === 'cierre' ? t('adios_cierre')
                         : m.motivo ? t('adios_limite') : T[lang].adios(m.detalle);
      return;
    }
    if (m.type === 'listo') {
      estado.textContent = T[lang].listo(m);
      inicioLlamada = Date.now();
      ponerEstado('escuchando');
      arrancarAudio(m.sample_rate);
      return;
    }
    if (m.type === 'alerta') { mostrarAlerta(m); return; }
    if (m.type === 'callar') { callar(m.hasta); return; }
    if (m.type === 'descartado') {
      // Se dice, no se calla: un turno que desaparece sin rastro es
      // indistinguible de un micrófono que no funciona.
      repintable(burbuja('eco', `«${m.texto}»`), () => metaEl(t('eco_meta')));
      return;
    }
    if (m.type === 'frase') {
      // Cada frase llega antes que su audio: se ve en cuanto existe.
      if (!lineaVera) lineaVera = burbuja('vera', m.texto);
      else lineaVera.querySelector('.cuerpo').textContent += ' ' + m.texto;
      conversacion.scrollTop = conversacion.scrollHeight;
      return;
    }
    if (m.type === 'vera') {
      const d = lineaVera || burbuja('vera', m.utterance || t('sin_responder'));
      cerrarTurnoVera(d, m, false);
      lineaVera = null;
      return;
    }
    if (m.type !== 'oido') return;

    if (m.cerrado) {
      // Lo que interesa medir no es cuánto lleva conectado sino cuánto tardó en
      // cerrar el turno desde que dejó de hablar.
      const cierre = tParcial ? ((Date.now() - tParcial) / 1000).toFixed(2) + ' s' : '—';
      for (const a of adelantadas[m.orden] || []) a.antes = ((Date.now() - a.t) / 1000).toFixed(2);
      if (adelantadas[m.orden]) pintarAlertas();
      delete adelantadas[m.orden];
      vivo.textContent = '';
      tParcial = 0;
      lineaVera = null;
      ponerEstado('pensando');
      const d = burbuja('yo', m.texto);
      registrar(d.querySelector('.cuerpo'), m.texto);
      repintable(d, () => {
        const p = document.createElement('div');
        p.appendChild(chips(m.senales));
        p.appendChild(metaEl(`${t('turno')} ${m.orden} · ${t('riesgo')} ${T[lang].riesgos[m.riesgo] || m.riesgo} · ${t('cierre')} +${cierre}`));
        return p;
      });
    } else {
      vivo.textContent = m.texto;
      vivo.appendChild(chips(m.senales));
      tParcial = Date.now();
      if (!sonandoAhora) ponerEstado('escuchando');
    }
  };
  ws.onclose = () => {
    if (ws && !despedida) estado.textContent = t('terminada');
    parar();
  };
};

async function arrancarAudio(rate) {
  // Pedir el sample rate directamente evita remuestrear a mano: el navegador lo
  // hace bien y es una fuente menos de ruido en una prueba de reconocimiento.
  ctx = new AudioContext({ sampleRate: rate });
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' })));
  const nodo = new AudioWorkletNode(ctx, 'captura');
  nodo.port.onmessage = e => {
    // La energía del trozo mueve el orbe mientras la paciente habla. Se mide
    // antes de mandarlo, sobre una de cada cuatro muestras: sobra para un gesto.
    const a = new Int16Array(e.data);
    let s = 0;
    for (let i = 0; i < a.length; i += 4) s += a[i] * a[i];
    nivelMic = Math.max(nivelMic, Math.min(1, Math.sqrt(s / Math.max(1, a.length / 4)) / 5000));
    if (ws?.readyState === 1) ws.send(e.data);
  };
  ctx.createMediaStreamSource(stream).connect(nodo);
  nodo.connect(ctx.destination);
}

function parar() {
  vivo.textContent = '';
  if (ws) { const w = ws; ws = null; w.close(); }
  if (!despedida) callar(Number.MAX_SAFE_INTEGER);
  stream?.getTracks().forEach(tr => tr.stop());
  ctx?.close();
  ctx = stream = null;
  inicioLlamada = null;
  pintarBoton();
  if (!despedida || !sonandoAhora) ponerEstado('reposo');
}

// ------------------------------------------------------------ por texto
const entrada = document.getElementById('entrada');
let wsTexto, burbujaTexto, colaTexto = [], textoTerminado = false;

function abrirTexto() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  wsTexto = new WebSocket(`${proto}://${location.host}/ws/texto`);
  wsTexto.onopen = () => { colaTexto.forEach(x => wsTexto.send(x)); colaTexto = []; };
  wsTexto.onclose = () => { wsTexto = null; };
  wsTexto.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'speak') {
      // Cada frase llega en cuanto está completa, que es cuando en la llamada
      // empezaría a sonar: se ve aquí lo que el paciente oiría.
      burbujaTexto ||= burbuja('vera', '');
      const c = burbujaTexto.querySelector('.cuerpo');
      c.textContent += (c.textContent ? ' ' : '') + m.texto;
      if (!ws) { ponerEstado('hablando'); hablaTextoHasta = performance.now() + 1400; }
      conversacion.scrollTop = conversacion.scrollHeight;
      return;
    }
    if (m.type === 'adios') {
      // La conversación terminó —la paciente se despidió o llegó al tope—. El
      // siguiente mensaje abre una nueva, con su propio servidor de turno.
      textoTerminado = true;
      burbujaTexto = null;
      repintable(burbuja('separador', ''),
                 () => metaEl(T[lang].fin_texto[m.motivo] || T[lang].fin_texto.limite));
      return;
    }
    if (m.type !== 'turno') return;
    burbujaTexto ||= burbuja('vera', m.utterance);
    cerrarTurnoVera(burbujaTexto, m, true);
    if (m.riesgo === 'high' || m.riesgo === 'critical') alertaOrbe(m.riesgo);
    burbujaTexto = null;
    setTimeout(() => { if (!ws) ponerEstado('reposo'); }, 1400);
  };
}

function enviarTexto(texto) {
  if (!texto) return;
  if (textoTerminado) {
    textoTerminado = false;
    repintable(burbuja('separador', ''), () => metaEl(t('nueva')));
  }
  registrar(burbuja('yo', texto).querySelector('.cuerpo'), texto);
  burbujaTexto = null;
  if (!ws) ponerEstado('pensando');
  const msg = JSON.stringify({ texto });
  if (wsTexto?.readyState === 1) wsTexto.send(msg);
  else { colaTexto.push(msg); if (!wsTexto) abrirTexto(); }
}

document.getElementById('form-texto').onsubmit = e => {
  e.preventDefault();
  const texto = entrada.value.trim();
  entrada.value = '';
  enviarTexto(texto);
};

document.getElementById('es').onclick = () => cambiarIdioma('es');
document.getElementById('en').onclick = () => cambiarIdioma('en');
aplicarIdioma();
</script>
