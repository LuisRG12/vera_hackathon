[project]
name = "vera"
version = "0.1.0"
description = "Agente de voz clínico para seguimiento postoperatorio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Cliente WebSocket hacia AssemblyAI. uvicorn[standard] ya lo trae, pero se
    # declara aparte: es dependencia nuestra, no un detalle del servidor.
    "websockets>=13",
    "httpx>=0.27",
    # Conocimiento: embeddings ONNX (sin torch) y BM25. El modelo de embeddings
    # es la única pieza que sigue corriendo en esta máquina, y por eso no entra
    # torch: fastembed ejecuta el ONNX directamente, que pesa 2 GB menos.
    "fastembed>=0.4",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"server/main.py" = ["B008"]
# El léxico es un diccionario de datos: sus entradas son frases de paciente y
# partirlas por ancho de línea las volvería ilegibles para quien deba revisarlas.
"server/seguridad/lexico.py" = ["E501"]
# Los prompts son contenido, no código: partirlos por ancho de línea cambiaría
# literalmente lo que el modelo lee.
"server/seguridad/juez.py" = ["E501"]
"server/dialogo/prompts.py" = ["E501"]
