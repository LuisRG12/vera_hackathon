[project]
name = "vera"
version = "0.1.0"
description = "Agente de voz clínico para seguimiento postoperatorio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Cliente WebSocket hacia AssemblyAI. uvicorn[standard] ya lo trae, pero se
    # declara aparte: es dependencia nuestra, no un detalle del servidor.
    "websockets>=13",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"server/main.py" = ["B008"]
# El léxico es un diccionario de datos: sus entradas son frases de paciente y
# partirlas por ancho de línea las volvería ilegibles para quien deba revisarlas.
"server/seguridad/lexico.py" = ["E501"]
# El prompt del juez es contenido, no código: partirlo por ancho de línea
# cambiaría literalmente lo que el modelo lee.
"server/seguridad/juez.py" = ["E501"]
